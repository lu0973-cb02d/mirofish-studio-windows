<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MiroFish Studio · 连接工作区</title>
  <style>
    :root{color-scheme:light;--accent:#0d8a70;--ink:#1c2b40;--muted:#607089;--line:#e2e8f0}
    *{box-sizing:border-box}body{margin:0;padding-top:40px;background:#f4f7fb;color:var(--ink);font:14px/1.7 "Segoe UI","Microsoft YaHei",sans-serif}
    .titlebar{position:fixed;inset:0 0 auto;height:40px;padding:0 155px 0 16px;background:#f4f7fb;color:#40506a;border-bottom:1px solid var(--line);display:flex;align-items:center;font-size:12px;font-weight:600;-webkit-app-region:drag;user-select:none}
    main{width:min(840px,calc(100% - 64px));margin:8vh auto;display:grid;grid-template-columns:238px 1fr;background:#fff;border:1px solid #dce4ed;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px #18334b0a;animation:enter .28s cubic-bezier(.2,.75,.25,1) both}
    aside{background:#111c2e;color:#eef4fc;padding:32px 26px;display:flex;flex-direction:column}.logo{width:48px;height:48px;border-radius:13px;background:#123e35;display:grid;place-items:center;color:#9be0c9;margin-bottom:20px}.logo svg{width:29px;height:29px}aside h2{font-size:20px;letter-spacing:-.5px;line-height:1.3;margin:0}aside h2 span{display:block;color:#8eabc0;font-weight:400;font-size:11px;letter-spacing:2px;margin-top:8px}.features{padding:0;list-style:none;margin:48px 0 20px;color:#b8c8d9;font-size:12px}.features li{padding:11px 0;border-bottom:1px solid #ffffff0c}.features li:before{content:'✓';color:#69d1b2;margin-right:9px}.local{margin-top:auto;color:#89a2b9;font-size:11px;padding-top:35px}
    .content{padding:36px 34px}.eyebrow{font-size:10px;letter-spacing:1.6px;font-weight:700;color:var(--accent)}h1{font-size:25px;letter-spacing:-.6px;line-height:1.4;margin:9px 0 11px}p{color:var(--muted);font-size:13px;margin:0 0 22px}.hint{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:15px 16px;font-size:12px}.hint>span:first-child{display:block;font-weight:600;color:#40506a;margin-bottom:6px}.path{display:block;color:#4c6076;font:12px/1.7 Consolas,"Microsoft YaHei",monospace;overflow-wrap:anywhere}.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;border:1px solid transparent;border-radius:8px;padding:10px 14px;font:600 13px "Segoe UI","Microsoft YaHei",sans-serif;cursor:pointer;transition:background .18s,box-shadow .18s,transform .18s,border-color .18s}button.primary{background:var(--accent);color:#fff;box-shadow:0 3px 8px #0d8a7020}button.primary:hover:not(:disabled){background:#08765e;box-shadow:0 6px 14px #0d8a7030;transform:translateY(-1px)}button.secondary{background:#fff;color:#40506a;border-color:#d7e1eb}button.secondary:hover:not(:disabled){border-color:#7fb1a2;background:#f3faf7}button:active:not(:disabled){transform:scale(.98)}button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}button:focus-visible{outline:3px solid #78beab;outline-offset:3px}button svg{width:15px;height:15px}#status{min-height:42px;margin-top:16px;color:#b1493f;font-size:12px;transition:color .18s}#status[data-kind=progress]{color:var(--accent)}.progress-dot{display:none;width:12px;height:12px;border:2px solid #bdded4;border-top-color:var(--accent);border-radius:50%;animation:spin .85s linear infinite}.busy .progress-dot{display:inline-block}.detail{border-top:1px solid var(--line);padding-top:18px;font-size:11px;color:#748299;margin:6px 0 0}details{margin-top:10px;font-size:12px;color:var(--muted)}summary{cursor:pointer;padding:5px 0;color:#496078}details p{font-size:12px;margin:6px 0 0}code{background:#eef3f7;border-radius:4px;padding:1px 4px;font-size:11px}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:740px){main{grid-template-columns:1fr;max-width:530px;margin:5vh auto}aside{padding:24px;display:none}.content{padding:30px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
  </style>
</head>
<body>
<div class="titlebar">MiroFish Studio</div>
<main>
  <aside><div class="logo"><img src="resources/mirofish-logo.png" width="48" height="48" alt="MiroFish" /></div><h2>MiroFish<span>STUDIO · 1.1.0</span></h2><ul class="features"><li>模型预设，快速切换</li><li>Zep 连接，自动轮换</li><li>推演记录，备份与恢复</li></ul><div class="local">本地运行 · 自由配置</div></aside>
  <section class="content"><span class="eyebrow">WELCOME TO MIROFISH</span><h1>连接你的工作区</h1><p>选择已有的 MiroFish Studio 文件夹，即可继续使用你的模型配置与推演记录。</p>
  <div class="hint"><span>工作目录</span><span id="path" class="path">正在检查…</span></div>
  <div class="actions"><button class="secondary" id="choose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7V5h7l2 2h9v13H3Z"/></svg>选择文件夹</button><button class="primary" id="continue" disabled><span class="progress-dot"></span><span id="continue-label">打开工作台</span></button></div>
  <div id="status" role="status" aria-live="polite"></div>
  <div class="detail">第一次使用？全量安装版已包含所需环境，安装后即可配置连接。</div>
  <details><summary>如何选择正确的目录？</summary><p>选择包含 <code>local_studio</code> 和 <code>backend</code> 的 MiroFish Studio 文件夹，并确保其 Python 运行环境可用。</p></details>
  </section>
</main>
<script>
  const path = document.querySelector('#path'), status = document.querySelector('#status'), go = document.querySelector('#continue'), choose = document.querySelector('#choose'), label = document.querySelector('#continue-label');
  let root = '';
  const feedback = (message, progress = false) => { status.textContent = message; status.dataset.kind = progress ? 'progress' : 'error'; };
  const render = async () => { try { const s = await window.mirofishDesktop.getStatus(); root = s.root || ''; path.textContent = root || '尚未选择工作目录'; go.disabled = !s.ready; } catch { feedback('暂时无法读取工作区，请重新打开软件。'); } };
  choose.onclick = async () => { feedback(''); try { const result = await window.mirofishDesktop.chooseRoot(); if (result?.root) { root = result.root; path.textContent = root; go.disabled = !result.ready; if (!result.ready) feedback('这个文件夹还不是可用的 MiroFish Studio 工作区，请重新选择。'); } else if (result?.error) feedback(result.error); } catch { feedback('无法打开目录选择窗口，请重试。'); } };
  go.onclick = async () => { go.disabled = true; choose.disabled = true; go.classList.add('busy'); label.textContent = '正在连接'; feedback('正在启动本地工作台，请稍候…', true); try { const result = await window.mirofishDesktop.setRoot(root); if (result?.ok) feedback('连接成功，正在打开工作台…', true); else { feedback(result?.error || '工作区暂时无法使用，请重新选择。'); go.disabled = false; } } catch { feedback('连接失败，请重试或重新选择目录。'); go.disabled = false; } finally { choose.disabled = false; go.classList.remove('busy'); label.textContent = '打开工作台'; } };
  render();
</script>
</body>
</html>
