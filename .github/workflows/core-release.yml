name: Publish core update

# Publishes a signed core bundle (backend, locales, built UI) that installed
# applications can fetch from "Core version" in the workbench. Installers are
# released by windows-release.yml on `v*` tags; `core-v*` tags never trigger it.
#
#   git tag -a core-v1.1.1 -m "What changed, in a few lines"
#   git push origin core-v1.1.1
#
# Needs the repository secret CORE_SIGNING_KEY (see docs/CORE_UPDATES.md).

on:
  push:
    tags:
      - 'core-v*'

permissions:
  contents: write

concurrency:
  group: core-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Check the tag and signing key
        env:
          CORE_SIGNING_KEY: ${{ secrets.CORE_SIGNING_KEY }}
        run: |
          if ! [[ "$TAG" =~ ^core-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag must look like core-v1.2.3"; exit 1
          fi
          if [ -z "$CORE_SIGNING_KEY" ]; then
            echo "::error::Repository secret CORE_SIGNING_KEY is not set (see docs/CORE_UPDATES.md)"; exit 1
          fi
          echo "VERSION=${TAG#core-v}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6

      - name: Install locked dependencies
        run: |
          npm ci --prefix frontend
          uv sync --project backend --frozen

      - name: Test
        run: |
          uv run --project backend --frozen python -m pytest -q
          python scripts/audit-release.py
          npm --prefix frontend test

      - name: Build the interface
        run: npm --prefix frontend run build

      - name: Build and sign the bundle
        env:
          CORE_SIGNING_KEY: ${{ secrets.CORE_SIGNING_KEY }}
        run: |
          NOTES="$(git tag -l --format='%(contents)' "$TAG" | head -c 3500)"
          uv run --project backend --frozen python scripts/build-core-bundle.py \
            --version "$VERSION" --out dist-core --notes "$NOTES"
          echo "NOTES<<EOF_NOTES" >> "$GITHUB_ENV"
          echo "${NOTES:-MiroFish core $VERSION}" >> "$GITHUB_ENV"
          echo "EOF_NOTES" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Not the repository's "latest" release: that stays the installer.
          gh release create "$TAG" "dist-core/mirofish-core-$VERSION.zip" \
            --verify-tag --latest=false --title "MiroFish core $VERSION" --notes "$NOTES"
